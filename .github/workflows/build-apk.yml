name: Build Launcher APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare release artifact
        run: |
          cd app/build/outputs/apk/release
          APK=$(ls -1 *.apk | head -n 1)
          mv "$APK" GrandHorizonRP-Launcher.apk
          cd -

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrandHorizonRP-Launcher
          path: app/build/outputs/apk/release/GrandHorizonRP-Launcher.apk

      - name: Publish to latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Grand Horizon RP Launcher (auto build)
          body: |
            Automated build from main branch.

            - GrandHorizonRP-Launcher.apk - install this on your Android phone
            - gamedata-*.zip - game data packages downloaded automatically by the launcher
          files: |
            app/build/outputs/apk/release/GrandHorizonRP-Launcher.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
