name: Build Launcher APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Sign, Verify & Release Launcher APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download unsigned launcher APK (diagnostic build baseline)
        run: |
          curl -sL --retry 3 -o launcher-unsigned.apk \
            "https://github.com/raj998302-art/GrandHorizonRP-Launcher/releases/download/latest/launcher-unsigned.apk"
          EXPECTED=117378519
          ACTUAL=$(stat -c%s launcher-unsigned.apk)
          echo "size: $ACTUAL (expected $EXPECTED)"
          test "$ACTUAL" -eq "$EXPECTED"

      - name: ZipAlign + Sign with release keystore
        run: |
          java -jar tools/uber-apk-signer.jar \
            -a launcher-unsigned.apk \
            --ks keystore/ghrp-release.keystore \
            --ksAlias ghrp \
            --ksPass GrandHorizon2026 \
            --ksKeyPass GrandHorizon2026 \
            -o out
          ls -la out/
          mv out/*-aligned-signed.apk GrandHorizonRP-Launcher.apk
          sha256sum GrandHorizonRP-Launcher.apk

      - name: Verify signature and zipalign
        run: |
          java -jar tools/uber-apk-signer.jar -a GrandHorizonRP-Launcher.apk -y | tee verify.log
          grep -q "signature verified" verify.log
          grep -q "zipalign verified" verify.log

      - name: Static APK verification (package, version, stale refs, ABIs, DEX)
        run: |
          python3 tools/verify_apk.py GrandHorizonRP-Launcher.apk

      - name: Verify deterministic digest
        run: |
          EXPECTED_SHA=84b0feac7aa72c8a542b797c3e7934bc8b02422417faeb7554399ea5d8a7620c
          ACTUAL_SHA=$(sha256sum GrandHorizonRP-Launcher.apk | cut -d' ' -f1)
          echo "digest: $ACTUAL_SHA (expected $EXPECTED_SHA)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrandHorizonRP-Launcher
          path: GrandHorizonRP-Launcher.apk

      - name: Publish to latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Grand Horizon RP Launcher (auto build)
          body: |
            Grand Horizon RP Launcher — the original client, fully rebranded and
            re-signed with the project release keystore (deterministic build:
            this workflow reproduces the exact APK below from launcher-unsigned.apk).

            DIAGNOSTIC BUILD: this APK carries the GhrpBoot startup tracer
            (13 boot stages shown as on-screen toasts + logcat tag GHRP_BOOT +
            Android/data/com.grandhorizonrp.launcher/files/ghrp-boot.txt) and a
            crash reporter that shows any Java crash on screen and writes it to
            ghrp-crash.txt. If the app closes on startup, note the LAST stage
            toast you saw (or the crash text) and report it — that pinpoints
            the failing startup step on your specific device.

            Assets on this release:
            - GrandHorizonRP-Launcher.apk — install this on your Android phone
            - launcher-unsigned.apk — unsigned build baseline used by CI
            - server.zip — ready-to-upload SA-MP server package (LemmeHost)

            Game data (4.12 GB, downloaded automatically by the launcher) lives on
            the "gamedata" release: 159 flat assets + patch_index.json + 3 full
            archive parts (gamedata-part1/2/3.zip).
          files: |
            GrandHorizonRP-Launcher.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
