name: Build Grand Horizon RP Launcher (Gradle + GHEngine)

on:
  workflow_dispatch:
  push:
    paths:
      - 'launcher-gradle/**'
      - 'tools/**'
      - '.github/workflows/build-gradle.yml'

permissions:
  contents: write

jobs:
  build:
    name: Engine (NDK) + Gradle assembleRelease + verify + release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install NDK r27c (runner has the SDK preinstalled)
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build GHEngine native library (own C++ sources only)
        run: |
          NDK_ROOT="$ANDROID_NDK_HOME" tools/build-engine.sh
          echo "engine libs:"
          ls -la launcher-gradle/app/src/main/jniLibs/*/libghengine.so

      - name: Host-side engine verification (real game-data samples)
        run: |
          bash tools/verify-engine-host.sh

      - name: Build APK (real Gradle + AGP pipeline)
        working-directory: launcher-gradle
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK (badging + signature + provenance)
        run: |
          APK=launcher-gradle/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "--- badging ---"
          "$BT/aapt2" dump badging "$APK" | head -6
          echo "--- signature ---"
          "$BT/apksigner" verify --print-certs "$APK" | head -4
          "$BT/apksigner" verify -v "$APK" | head -4
          "$BT/zipalign" -c 4 "$APK" && echo "zipalign OK"
          echo "--- native lib provenance (must be ONLY libghengine.so) ---"
          unzip -l "$APK" | grep "lib/" || true
          BAD=$(unzip -l "$APK" | grep "lib/" | grep -vc "libghengine.so" || true)
          if [ "$BAD" != "0" ]; then echo "FATAL: unexpected native libs present"; exit 1; fi
          echo "--- dex provenance (must be ONLY com/grandhorizonrp) ---"
          BADDEX=$("$BT/dexdump" "$APK" | grep "Class descriptor" | grep -vc "com/grandhorizonrp" || true)
          if [ "$BADDEX" != "0" ]; then echo "FATAL: foreign classes in dex"; exit 1; fi
          echo "PROVENANCE OK: from-scratch engine + from-scratch Java only"

      - name: Publish APK to release (REST API)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=launcher-gradle/app/build/outputs/apk/release/app-release.apk
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "sha256: $SHA"
          RID=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/latest" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "release id: $RID"
          for NAME in GrandHorizonRP-Launcher-v8-EngineFromScratch.apk GrandHorizonRP-Launcher.apk; do
            AID=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RID/assets" \
              | python3 -c "import json,sys
        for a in json.load(sys.stdin):
            if a['name'] == '$NAME': print(a['id']); break")
            if [ -n "$AID" ]; then
              curl -s -X DELETE -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/releases/assets/$AID"
              echo "deleted old $NAME"
            fi
            curl -s -X POST -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @"$APK" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/$RID/assets?name=$NAME" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print('uploaded:', d.get('name'), d.get('size'), 'bytes')"
          done
