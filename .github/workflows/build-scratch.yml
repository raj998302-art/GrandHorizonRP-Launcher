name: Build from-scratch launcher (v6)

on:
  workflow_dispatch:
  push:
    paths:
      - 'launcher-scratch/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Fetch toolchain (build-tools 36, platform 36, ECJ)
        run: |
          mkdir -p sdk tools dl
          curl -sL -o sdk/bt36.zip  https://dl.google.com/android/repository/build-tools_r36_linux.zip
          curl -sL -o sdk/plat36.zip https://dl.google.com/android/repository/platform-36_r02.zip
          curl -sL -o tools/ecj.jar  https://repo1.maven.org/maven2/org/eclipse/jdt/ecj/3.36.0/ecj-3.36.0.jar
          unzip -q sdk/bt36.zip -d sdk/bt36x
          unzip -q sdk/plat36.zip -d sdk/plat36x
          BT_DIR=$(dirname "$(find sdk/bt36x -name aapt2 | head -1)")
          PLAT_JAR=$(find sdk/plat36x -name android.jar | head -1)
          echo "BT_DIR=$BT_DIR" >> $GITHUB_ENV
          echo "PLAT_JAR=$PLAT_JAR" >> $GITHUB_ENV

      - name: Fetch native libs from published v5 baseline
        run: |
          curl -sL -o dl/v5.apk "https://github.com/${{ github.repository }}/releases/download/latest/GrandHorizonRP-Launcher-Final.apk"
          mkdir -p launcher-scratch/app/lib
          cd launcher-scratch/app/lib
          unzip -o -q ../../dl/v5.apk 'lib/arm64-v8a/*' 'lib/armeabi-v7a/*' || true
          # unzip preserves lib/ prefix; flatten
          if [ -d lib ]; then mv lib/* . ; rmdir lib; fi
          ls -la arm64-v8a | head -5

      - name: Build APK
        run: |
          cd launcher-scratch
          ANDROID_JAR="$PLAT_JAR"
          BT="$BT_DIR"
          rm -rf build && mkdir -p build/obj build/dex
          find app/src -name '*.java' > build/sources.txt
          java -jar ../tools/ecj.jar -source 1.8 -target 1.8 \
              -bootclasspath "$ANDROID_JAR" -proc:none -nowarn \
              -d build/obj @build/sources.txt
          find build/obj -name '*.class' > build/classes.txt
          "$BT/d8" --release --lib "$ANDROID_JAR" --min-api 26 \
              --output build/dex $(cat build/classes.txt | tr '\n' ' ')
          "$BT/aapt2" compile --dir app/res -o build/res.zip
          "$BT/aapt2" link -o build/base.apk \
              -I "$ANDROID_JAR" \
              --manifest app/AndroidManifest.xml \
              --min-sdk-version 26 --target-sdk-version 36 \
              --version-code 1529 --version-name 16.102.14498 \
              --auto-add-overlay build/res.zip
          cp build/base.apk build/unsigned.apk
          (cd build/dex && zip -q -j ../unsigned.apk classes.dex)
          (cd app && zip -q -r ../build/unsigned.apk lib/ assets/)
          ls -la build/unsigned.apk

      - name: Sign + verify
        run: |
          cd launcher-scratch
          java -jar ../tools/uber-apk-signer.jar \
              -a build/unsigned.apk \
              --ks ../keystore/ghrp-release.keystore \
              --ksAlias ghrp --ksPass "$KSPASS" --ksKeyPass "$KSPASS" \
              --out build/signed
          cp build/signed/unsigned-aligned-signed.apk GrandHorizonRP-Launcher-v6-CI.apk
          sha256sum GrandHorizonRP-Launcher-v6-CI.apk
        env:
          KSPASS: GrandHorizon2026

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghrp-launcher-v6
          path: launcher-scratch/GrandHorizonRP-Launcher-v6-CI.apk
